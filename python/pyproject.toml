[build-system]
requires = ["scikit-build-core>=0.11", "setuptools-scm"]
build-backend = "scikit_build_core.build"

[project]
name = "pysigmarsolver"
dynamic = ["version"]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
description="Python bindings for libsigmarsolver"
authors = [
  { name = "Joshua Barrass", email = "josh.barrass.work@gmail.com" },
]
requires-python = ">=3.8"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["sigmarsolver"]
wheel.py-api = "py3"
cmake.build-type = "Release"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
root = ".."