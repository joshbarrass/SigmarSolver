name: Release Builds

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write  #  for release creation (svenstaro/upload-release-action)

jobs:
  create_release:
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release create --repo "${{ github.repository}}" --draft --title ${{ github.ref_name }} ${{ github.ref_name }}

  build_shared:
    needs: create_release
    strategy:
      matrix:
        os: ["ubuntu-22.04", "windows-2025"]
        include:
          - buildsubdir: ""
          - linkfile: ""
          - os: "ubuntu-22.04"
            jobname: "Linux"
            libname: "libsigmarsolver.so"
          - os: "windows-2025"
            jobname: "Windows"
            buildsubdir: "Release/"
            libname: "sigmarsolver.dll"
            linkfile: "sigmarsolver.lib"

    name: Build Library (${{ matrix.jobname }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Configure CMake
        shell: bash
        run: |
          rm -rf build
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST_BINARIES=ON .

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run Tests
        shell: bash
        run: |
          cd build/${{ matrix.buildsubdir }}
          shopt -s nullglob
          for test in ./test*; do
            if [ -x "$test" ] && [ -f "$test" ]; then
              echo "Running $test..."
              "$test" || exit 1
            fi
          done

      - name: Upload Library
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload ${{ github.ref_name }} build/${{ matrix.buildsubdir }}${{ matrix.libname }}

      - name: Upload Extras
        if: matrix.linkfile != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload ${{ github.ref_name }} build/${{ matrix.buildsubdir }}${{ matrix.linkfile }}

  build_python:
    needs: create_release
    strategy:
      matrix:
        os: ["ubuntu-22.04", "windows-2025"]
        include:
          - os: "ubuntu-22.04"
            jobname: "Linux"
          - os: "windows-2025"
            jobname: "Windows"

    name: Build Python Wheel (${{ matrix.jobname }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: Build Wheel
        run: |
          pip wheel ./python/

      - name: Install Wheel
        shell: bash
        run: |
          pip install ./*.whl

      - name: Run Tests
        shell: bash
        run: |
          shopt -s nullglob
          for test in ./test*.py; do
            if [ -f "$test" ]; then
              echo "Running $test..."
              python "$test" || exit 1
            fi
          done

      - name: Upload Wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload ${{ github.ref_name }} ./*.whl
